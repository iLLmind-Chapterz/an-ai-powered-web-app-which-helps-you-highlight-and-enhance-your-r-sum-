<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gap Analyzer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
      // Suppress Vite HMR WebSocket errors which are expected in this environment
      window.addEventListener('unhandledrejection', (event) => {
        if (event.reason && 
            (event.reason.message === 'WebSocket closed without opened.' || 
             (typeof event.reason.message === 'string' && event.reason.message.includes('WebSocket')))) {
          event.preventDefault();
        }
      });
      // Also suppress the error log itself if possible
      const originalError = console.error;
      console.error = (...args) => {
        if (args[0] && typeof args[0] === 'string' && args[0].includes('[vite] failed to connect to websocket')) {
          return;
        }
        originalError.apply(console, args);
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
